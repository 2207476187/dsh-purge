name: Sync Upstream
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Add upstream remote
        run: git remote add upstream https://github.com/YuJunZhiXue/dsh-purge.git
      - name: Fetch and merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch upstream
          git checkout master
          BEFORE=$(git rev-parse HEAD)
          git merge upstream/master --no-edit --no-ff
          # GITHUB_TOKEN 没有 workflows 权限，推送 .github/workflows 的任何改动都会被 GitHub 拒绝。
          # 本 fork 的 Release 工作流带 github.repository 判断，本来就不会执行，保持本地版本即可。
          git rm -r --cached -q .github/workflows
          git checkout "$BEFORE" -- .github/workflows
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
      - name: Push back
        run: git push origin master
