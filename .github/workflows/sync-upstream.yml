name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/YuJunZhiXue/dsh-purge.git

      - name: Fetch and merge upstream
        run: |
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit --no-ff

      - name: Push back
        run: git push origin master
